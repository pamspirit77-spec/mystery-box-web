<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Box — Admin Top-up</title>
<link rel="stylesheet" href="admin.css">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="admin-shell">
  <section id="loginPanel" class="panel login-panel">
    <h1>🛠️ Admin Control</h1>
    <p>เข้าสู่ระบบสำหรับผู้ดูแลเท่านั้น</p>
    <form id="loginForm">
      <input id="adminEmail" type="email" placeholder="อีเมลแอดมิน" autocomplete="username" required>
      <input id="adminPassword" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <button type="submit">เข้าสู่ระบบ</button>
      <div id="loginMessage" class="message"></div>
    </form>
  </section>

  <section id="adminPanel" class="hidden">
    <div class="admin-header">
      <div>
        <h1>🛠️ ระบบแอดมินเติมเงิน</h1>
        <p>ตรวจสอบ Wallet / บัตร TrueMoney ก่อนอนุมัติ</p>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="secondary">รีเฟรช</button>
        <button id="logoutBtn" class="secondary">ออกจากระบบ</button>
      </div>
    </div>
    <div id="adminStatus" class="message"></div>
    <div id="topupList" class="request-list"></div>
  </section>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
